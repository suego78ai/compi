# ==============================================================================
# Nginx configuration for compi.mojuk.kr (University Admissions Dashboard)
# Upstream Target: http://127.0.0.1:26240
# ==============================================================================

# HTTP (Port 80) -> Reverse Proxy & Optional HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name compi.mojuk.kr;

    # Client upload size limit (allows large Excel and batch JSON updates)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:26240;
        proxy_http_version 1.1;

        # WebSocket & Long-lived Connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for real-time scraping batches
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Disable buffering for live streaming/logs
        proxy_buffering off;
    }
}

# HTTPS (Port 443) -> Reverse Proxy
# (Active when SSL certificates are installed, e.g. via Certbot or mojuk.kr wildcard cert)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compi.mojuk.kr;

    # SSL Certificate Paths (Adjust if using custom certificates)
    ssl_certificate /etc/letsencrypt/live/mojuk.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mojuk.kr/privkey.pem;
    # Fallback paths for standalone cert
    # ssl_certificate /etc/letsencrypt/live/compi.mojuk.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/compi.mojuk.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:26240;
        proxy_http_version 1.1;

        # WebSocket & Long-lived Connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts for real-time scraping batches
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Disable buffering for live streaming/logs
        proxy_buffering off;
    }
}
